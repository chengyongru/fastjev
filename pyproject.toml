[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastjev"
version = "0.1.0"
description = "SDK-first, self-hosted semantic decisions with open models"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
keywords = ["semantic-decisions", "inference", "sdk", "llm"]
dependencies = []

[project.optional-dependencies]
torch = [
  "torch==2.10.0",
  "transformers==5.17.0",
  "accelerate==1.12.0",
  "safetensors==0.8.0",
  "huggingface-hub==1.31.0",
  "tokenizers==0.23.2",
  "numpy==2.2.6",
  "sentencepiece==0.2.1",
  "protobuf==7.36.1",
]
api = [
  "fastapi==0.136.3",
  "uvicorn==0.53.0",
]
test = [
  "pytest==8.4.2",
  "fastapi==0.136.3",
  "httpx==0.28.1",
  "uvicorn==0.53.0",
]
mlx = [
  "mlx==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
llama-cpp = [
  "llama-cpp-python==0.3.35",
  "huggingface-hub==1.31.0",
]
vllm = [
  "vllm==0.29.0",
]

[project.scripts]
fastjev-score = "semif_phase1.cli:main"
fastjev-serve = "semif_phase1.server:main"
semif-score = "semif_phase1.cli:main"
semif-serve = "semif_phase1.server:main"

[project.urls]
Homepage = "https://github.com/chengyongru/fastjev"
Repository = "https://github.com/chengyongru/fastjev"
Issues = "https://github.com/chengyongru/fastjev/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "webgpu-demo"]
